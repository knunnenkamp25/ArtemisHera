name: ArtemisHera Scraper
run-name: "Scrape: ${{ inputs.project_name }} [${{ inputs.project_id }}]"

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID (assigned by the app)'
        required: true
      project_name:
        description: 'Human-readable project name'
        required: true
      urls:
        description: 'Newline-separated URLs (web mode only, capped at 5)'
        required: false
        default: ''
      mode:
        description: 'news (resolve from geography) or web (manual pages)'
        required: false
        default: 'web'
      states:
        description: 'news mode: comma-separated state abbreviations'
        required: false
        default: ''
      dmas:
        description: 'news mode: pipe-separated DMA names (empty = all in states)'
        required: false
        default: ''
      types:
        description: 'news mode: pipe-separated outlet types (empty = all)'
        required: false
        default: ''
      days:
        description: 'Look-back days (0 = bulk scrape)'
        required: false
        default: '2'
      max_articles:
        description: 'Max articles per site'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper openpyxl lxml

      - name: Run scraper
        env:
          URLS: ${{ inputs.urls }}
          MODE: ${{ inputs.mode }}
          STATES: ${{ inputs.states }}
          DMAS: ${{ inputs.dmas }}
          TYPES: ${{ inputs.types }}
          DAYS: ${{ inputs.days }}
          MAXA: ${{ inputs.max_articles }}
          PID: ${{ inputs.project_id }}
        run: |
          mkdir -p data/news
          ARGS="--export-json data/news/${PID}.json --max-articles ${MAXA} -o /tmp/${PID}.xlsx"
          if [ "${DAYS}" != "0" ]; then ARGS="$ARGS --today --days ${DAYS}"; fi

          if [ "${MODE}" = "web" ]; then
            if [ -z "${URLS}" ]; then echo "web mode requires urls" && exit 1; fi
            echo "${URLS}" | head -5 > /tmp/urls.txt          # manual scrape stays capped
          else
            # Resolve the geography here rather than shipping thousands of URLs
            # through workflow_dispatch inputs, which are size-capped.
            python - <<'EOF' > /tmp/urls.txt
          import json, os
          sites = json.load(open('data/news_sites.json'))
          states = {s.strip() for s in os.environ.get('STATES','').split(',') if s.strip()}
          dmas   = {d.strip() for d in os.environ.get('DMAS','').split('|') if d.strip()}
          types  = {t.strip() for t in os.environ.get('TYPES','').split('|') if t.strip()}
          out = []
          for s in sites:
              if states and s['state'] not in states: continue
              if types  and s['type']  not in types:  continue
              # a chosen DMA, or a statewide outlet with no DMA of its own
              if dmas and s['dma'] and s['dma'] not in dmas: continue
              out.append(s['url'])
          print('\n'.join(dict.fromkeys(out)))
          EOF
          fi

          COUNT=$(grep -c . /tmp/urls.txt || echo 0)
          echo "Resolved ${COUNT} sites (mode=${MODE} states=${STATES} dmas=${DMAS})"
          if [ "${COUNT}" -eq 0 ]; then echo "No sites matched the selection" && exit 1; fi
          python scripts/news_scraper.py -f /tmp/urls.txt $ARGS

      - name: Update project manifest
        env:
          PID: ${{ inputs.project_id }}
          PNAME: ${{ inputs.project_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'EOF'
          import json, os, datetime
          pid = os.environ['PID']; pname = os.environ['PNAME']; mode = os.environ.get('MODE','web')
          path = 'data/projects.json'
          try:
              projects = json.load(open(path))
          except Exception:
              projects = []
          try:
              result = json.load(open(f'data/news/{pid}.json'))
              count = result.get('meta', {}).get('total', len(result.get('articles', [])))
          except Exception:
              count = 0
          now = datetime.datetime.utcnow().isoformat() + 'Z'
          projects = [p for p in projects if p.get('id') != pid]
          projects.insert(0, {
              'id': pid, 'name': pname,
              'type': 'news-scrape' if mode == 'news' else 'web-scrape',
              'status': 'complete', 'subject': 'Cloud scrape',
              'summary': f'{count} articles collected',
              'created': now, 'updated': now,
          })
          json.dump(projects, open(path, 'w'), indent=2)
          EOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes" || git commit -m "Scrape results: ${{ inputs.project_name }} [${{ inputs.project_id }}]"
          git pull --rebase origin main || true
          git push
